services:
  backend:
    build: ./apps/backend
    # Xarxa host: el contenidor comparteix la xarxa de la màquina, així que
    # "localhost:5432" de dins del contenidor és el localhost real del host.
    # Fa servir el .env tal qual (ja apunta al teu Postgres natiu amb
    # les teves dades) — no calen ports: ni environment: aquí.
    network_mode: host

  mediaserver:
    build: ./apps/mediaserver
    extra_hosts:
      # El backend ja no corre dins de Docker: parla directament amb el teu
      # Postgres natiu del host. Aquest mapeig permet que el contenidor
      # arribi al backend, que escolta a localhost:8000 del host.
      - "host.docker.internal:host-gateway"
    ports:
      # 8554 (RTSP) NO es publica a l'host: totes les fonts (simulador Docker
      # i Jetson real) hi publiquen per la xarxa interna de Docker o la xarxa
      # local del centre (mediaserver:8554), no des de fora. Només cal
      # publicar-lo si un dispositiu extern al host ha de fer push directe.
      - "8888:8888"   # HLS (consum des del frontend)

  edge:
    build: ./apps/edge
    depends_on:
      - mediaserver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # El backend corre natiu al host (fora de Docker), no com a servei
      # d'aquest compose.
      BACKEND_URL: http://host.docker.internal:8000
      CAMERA_ID: "1"
      PUBLISH_TOKEN: secreto_edge_123
      # 0 = primera webcam del sistema (cal --device a docker run, veure README);
      # també pot ser la ruta a un vídeo muntat, p. ex. /app/media/sample.mp4
      CAMERA_SOURCE: /app/media/sample.mp4
      MEDIASERVER_RTSP_URL: rtsp://mediaserver:8554
      YOLO_WEIGHTS: /app/models/yolov8n.pt
      # Per fer proves fàcilment sense un vídeo real d'ocells: si et mostres
      # tu mateix movent-te davant la font de vídeo, canvia-ho a "person"
      # per validar tot el pipeline (moviment -> YOLO -> crop -> API -> BBDD).
      BIRD_CLASS_NAME: bird
    volumes:
      - ./apps/edge/models:/app/models
      - ./apps/edge/media:/app/media
      - ./apps/edge/crops:/app/crops

  frontend:
    build: ./apps/frontend
    ports:
      - "5173:5173"
    volumes:
      # Muntem el codi font perquè el hot-reload de Vite funcioni sense
      # haver de reconstruir la imatge a cada canvi.
      - ./apps/frontend:/app
      - /app/node_modules
    environment:
      # Alguns entorns (WSL/Docker) no detecten canvis de fitxers sense
      # polling actiu.
      CHOKIDAR_USEPOLLING: "true"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # API S3 (backend natiu i futurs workers)
      - "9001:9001"   # Consola web: http://localhost:9001
    volumes:
      - miniodata:/data

  redis:
    image: redis:7-alpine
    ports:
      # Publicat perquè el backend (network_mode: host) hi arribi per
      # localhost:6379. Els workers, dins la xarxa normal de Docker, hi
      # arriben directament per "redis:6379" (nom del servei).
      - "6379:6379"

  worker-phase1:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.worker-phase1
    depends_on:
      - redis
    env_file:
      # Mateix .env que el backend (DATABASE_URL, credencials MinIO...).
      - ./apps/backend/.env
    extra_hosts:
      # Aquest worker NO fa servir network_mode: host, així que "localhost"
      # de dins seu no és el host — cal aquest mapeig per arribar al teu
      # Postgres natiu, igual que ja fa mediaserver/edge.
      - "host.docker.internal:host-gateway"
    environment:
      # Sobreescriuen el que hi hagi a .env (pensat per al backend, que sí
      # és host network): noms de servei de Docker + l'amfitrió del Postgres
      # natiu. Les credencials del DATABASE_URL de l'.env NO es toquen aquí
      # (veure database.py) — així funciona igual per a qualsevol clon del
      # repo, tingui les credencials de Postgres que tingui.
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      DB_HOST_OVERRIDE: host.docker.internal
    volumes:
      # Mateixos pesos de YOLO que ja fa servir l'Edge.
      - ./apps/edge/models:/app/models

  worker-phase2:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.worker-phase2
    depends_on:
      - redis
    env_file:
      - ./apps/backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      DB_HOST_OVERRIDE: host.docker.internal

volumes:
  miniodata:
